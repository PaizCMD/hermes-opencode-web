<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ForgeAI — Login ke akun">
  <title>Login — ForgeAI</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* ---------- Login page ---------- */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 32px;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .login-brand .brand-mark { font-size: 1.5rem; }
    .login-brand .brand-name { font-weight: 800; color: var(--primary); }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .login-card .lede {
      margin: 0 0 24px;
      color: var(--text-muted);
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .field input.invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    .field .error {
      margin: 6px 0 0;
      font-size: 0.8rem;
      color: var(--red);
    }

    .login-actions { margin-top: 24px; }

    .login-card .forgot {
      display: block;
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--primary);
      text-decoration: none;
    }

    .login-card .forgot:hover { text-decoration: underline; }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .login-footer a:hover { text-decoration: underline; }

    .demo-note {
      margin-top: 18px;
      padding: 10px 12px;
      background: var(--amber-soft);
      border: 1px solid var(--amber);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--amber);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">⚙️</span>
        <span class="brand-name">ForgeAI</span>
      </div>

      <h1>Masuk ke akun</h1>
      <p class="lede">Silakan masuk menggunakan kredensial Anda.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="mail@example.com"
            required
          >
          <p class="error" id="email-error" hidden>Format email tidak valid.</p>
        </div>

        <div class="field">
          <label for="password">Kata sandi</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Minimum 6 karakter"
            required
            minlength="6"
          >
          <p class="error" id="password-error" hidden>Kata sandi minimal 6 karakter.</p>
        </div>

        <div class="login-actions">
          <button type="submit" class="btn btn-primary btn-lg">Masuk</button>
        </div>
      </form>

      <p class="forgot"><a href="#lupa">Lupa kata sandi?</a></p>

      <p class="login-footer">
        Belum punya akun? <a href="#">Daftar</a>
      </p>

      <p class="demo-note">Demo: data tidak dikirim ke server mana pun.</p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var form = document.getElementById("login-form");
      var email = document.getElementById("email");
      var password = document.getElementById("password");
      var emailError = document.getElementById("email-error");
      var passwordError = document.getElementById("password-error");

      function showError(el, errorEl) {
        el.classList.add("invalid");
        errorEl.hidden = false;
      }

      function clearError(el, errorEl) {
        el.classList.remove("invalid");
        errorEl.hidden = true;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var valid = true;

        clearError(email, emailError);
        clearError(password, passwordError);

        if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
          showError(email, emailError);
          valid = false;
        }
        if (!password.value || password.value.length < 6) {
          showError(password, passwordError);
          valid = false;
        }

        if (!valid) return;

        // Demo only — no backend is connected. In a real app this would POST
        // to an API and redirect on success.
        var btn = form.querySelector("button[type=submit]");
        btn.textContent = "Memproses…";
        btn.disabled = true;
        window.setTimeout(function () {
          btn.textContent = "Masuk";
          btn.disabled = false;
          alert("Login demo berhasil (tanpa backend). Uji coba dalam wujud statis saja.");
        }, 600);
      });
    })();
  </script>
</body>
</html>
